name: Bug 报告
description: 报告可以稳定复现的功能异常
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请搜索现有 Issue，并确认问题可以在最新代码或最新发布版本中复现。
        安全漏洞请按照 SECURITY.md 通过邮件报告，不要在此公开。

  - type: input
    id: version
    attributes:
      label: 项目版本
      description: 请填写版本号或 Commit ID。
      placeholder: v1.0.0
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 请填写操作系统、JDK、Node.js、MySQL、Redis 和浏览器版本等相关信息。
      placeholder: |
        操作系统：
        JDK：
        Node.js：
        MySQL：
        Redis：
        浏览器：
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供能够重复出现问题的最小操作步骤。
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 请删除或遮挡密码、Token、密钥、手机号、邮箱和真实业务数据。
      render: shell

  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，未发现相同问题。
          required: true
        - label: 我提供的内容不包含真实密码、Token、密钥或其他敏感信息。
          required: true
