name: 功能建议
description: 提出新的功能、改进方向或使用场景
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。功能建议将结合项目定位、通用性和版本规划进行评估，提交建议不代表已经纳入开发计划。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 请说明你在什么业务场景下遇到了问题。
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 当前问题
      description: 请说明现有功能为什么无法满足该场景。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请描述期望的功能和使用方式。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 可选方案
      description: 如果考虑过其他实现方式，可以在这里说明。

  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，未发现相同建议。
          required: true
